# Sheldon configuration file
#
# See https://sheldon.cli.rs

shell = "zsh"

[templates]
defer = '''
    {{- hooks?.pre | nl }}
    {%- for file in files %}zsh-defer -mp source "{{ file }}"{{ "\n" }}
    {%- endfor %}
    {{- hooks?.post | nl }}'''
completion-fpath = '''
{%- for file in files %}
fpath+=("${${:-"{{ file }}"}:h}")
{%- endfor %}
'''

# Completions
# -----------

[plugins.docker-zsh-completion]
github = "greymd/docker-zsh-completion"
use = ["repos/**/completion/zsh/_*"]
apply = ["completion-fpath"]

[plugins.rust-zsh-completions]
github = "ryutok/rust-zsh-completions"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"

# Sourced
# -------

[plugins.history]
local = "~/.zsh/plugins"
use = ["history.plugin.zsh"]

[plugins.starship]
inline = '''
evalcache starship init zsh
RPROMPT=
'''

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# Deferred plugins
# ----------------

[plugins.wd]
github = "mfaerevaag/wd"
apply = ["fpath", "defer"]

[plugins.autoenv]
github = "zpm-zsh/autoenv"
apply = ["defer"]

[plugins.compinit]
local = "~/.zsh/plugins"
apply = ["defer"]

[plugins.local-1]
local = "~/.zsh/plugins"
use = ["{aliases*,gpg-agent,git,keybindings}.plugin.zsh"]
apply = ["defer"]

[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"
apply = ["defer"]
hooks.pre = "export YSU_MODE=ALL"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]
apply = ["defer"]
hooks.post = "zsh-defer -mp _zsh_autosuggest_start"
