name: build

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: ShellCheck
      run: shellcheck bootstrap/*.sh

    - name: StyLua
      working-directory: src/nvim
      run: uvx --from git+https://github.com/JohnnyMorganz/StyLua@56f9630407f6bf6ee524fb1d7fe71f005a570478 stylua --check .
